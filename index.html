<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>活动日历</title>
<style>
:root{--ink:#24382f;--muted:#78847b;--paper:#fbfaf6;--green:#476b55;--sage:#e8efe6;--line:#e6e8e1;--gold:#b48b4e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 50px}.hero{padding:26px 26px 22px;border-radius:22px;background:linear-gradient(135deg,#e8efe6,#f7f0e3);margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#667966}.hero h1{font-size:clamp(28px,5vw,42px);margin:9px 0 6px;letter-spacing:.04em}.hero p{margin:0;color:#657368}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.monthnav{display:flex;gap:10px;align-items:center}.monthnav h2{font-size:22px;min-width:150px;text-align:center;margin:0}.btn,select,input{border:1px solid #dce2d9;background:white;color:var(--ink);border-radius:11px;padding:10px 13px;font:inherit}.btn{cursor:pointer}.btn:hover{background:var(--sage)}.filters{display:flex;gap:8px;flex-wrap:wrap}.calendar{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #273a2c0a}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{text-align:center;padding:13px 4px;color:var(--muted);font-size:13px;background:#fafbf8;border-bottom:1px solid var(--line)}.day{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}.day:nth-child(7n){border-right:0}.day.other{background:#fbfbf9;color:#b7bdb7}.num{font-size:13px;color:#647168;margin-bottom:7px}.today .num{display:inline-flex;background:var(--green);color:white;border-radius:50%;width:25px;height:25px;align-items:center;justify-content:center}.event{display:block;width:100%;border:0;text-align:left;border-radius:7px;padding:5px 6px;margin:4px 0;background:var(--sage);color:#345541;font-size:12px;line-height:1.4;cursor:pointer;overflow-wrap:anywhere}.event:hover{filter:brightness(.97)}.event .time{opacity:.7;font-size:10px;display:block}.empty{padding:34px;text-align:center;color:var(--muted)}.status{font-size:12px;color:var(--muted);margin:12px 2px}.upcoming{margin-top:28px}.upcoming h2{font-size:21px}.eventlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.eventcard{background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.eventcard .date{color:var(--gold);font-size:12px;font-weight:700}.eventcard h3{margin:7px 0;font-size:16px}.eventcard p{margin:5px 0;color:#66736a;font-size:13px;white-space:pre-line}.modal{position:fixed;inset:0;background:#18251dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:4}.modal.show{display:flex}.panel{background:white;border-radius:18px;padding:22px;max-width:480px;width:100%;max-height:85vh;overflow:auto}.panel h2{margin-top:0}.panel p{white-space:pre-line;line-height:1.6}.close{float:right}.foot{text-align:center;color:#8a938b;font-size:12px;margin-top:25px}@media(max-width:650px){.wrap{padding:14px 9px 35px}.hero{padding:21px 18px}.day{min-height:83px;padding:4px}.week div{font-size:11px;padding:10px 1px}.num{font-size:11px;margin-bottom:3px}.event{font-size:10px;padding:4px 3px;margin:3px 0}.event .time{font-size:9px}.monthnav h2{font-size:19px;min-width:125px}.toolbar{align-items:flex-start}.day .more{font-size:10px;color:var(--muted)}}
</style></head>
<body><main class="wrap"><header class="hero"><div class="eyebrow">COMMUNITY · EVENTS · TOGETHER</div><h1>活动日历</h1><p>一目了然，轻松掌握每一项活动</p></header>
<div class="toolbar"><div class="monthnav"><button class="btn" id="prev" aria-label="上个月">‹</button><h2 id="monthLabel">载入中…</h2><button class="btn" id="next" aria-label="下个月">›</button><button class="btn" id="today">今天</button></div><div class="filters"><input id="search" placeholder="搜索活动…" aria-label="搜索活动"><select id="category"><option value="">所有活动</option></select></div></div>
<section class="calendar"><div class="week"><div>星期日</div><div>星期一</div><div>星期二</div><div>星期三</div><div>星期四</div><div>星期五</div><div>星期六</div></div><div class="days" id="days"></div></section><div class="status" id="status">正在载入公开日历资料…</div>
<section class="upcoming"><h2>近期活动</h2><div class="eventlist" id="upcoming"></div></section><div class="foot">活动资料以主办单位公布为准 · 日历资料自动读取公开表格</div></main>
<div class="modal" id="modal"><div class="panel"><button class="btn close" id="close">关闭 ✕</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?output=csv';
let events=[],view=new Date();view.setDate(1);const $=id=>document.getElementById(id);
function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'&&q&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[\s_\-（）()：:]/g,'')}
function findCol(headers,keys){return headers.findIndex(h=>keys.some(k=>norm(h).includes(norm(k))))}
function parseDate(raw){if(!raw)return null;let s=String(raw).trim();let m=s.match(/^(\d{4})[./年-](\d{1,2})[./月-](\d{1,2})日?$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);if(m){let a=+m[1],b=+m[2],y=+m[3];return a>12?new Date(y,b-1,a):new Date(y,a-1,b)}let d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function parseEvents(csv){
 let rows=parseCSV(csv);if(rows.length<2)return[];
 // The user's sheet has a title/instructions above the actual column headings.
 // Search the first 20 non-empty CSV rows for the most likely header row.
 let headerIndex=-1,h=[],di=-1,ni=-1,ti=-1,vi=-1,ci=-1,di2=-1;
 for(let ri=0;ri<Math.min(rows.length,20);ri++){
  const candidate=rows[ri].map(x=>x.trim());
  const cdi=findCol(candidate,['开始日期','活动日期','日期','date','活动日','日期（开始）']);
  const cni=findCol(candidate,['活动名称','活动内容','活动项目','活动事项','事项名称','活动','标题','event','title','program','项目名称']);
  // Avoid matching explanatory/title rows: a valid header should contain both a date and an activity/title column.
  if(cdi>=0&&cni>=0){headerIndex=ri;h=candidate;di=cdi;ni=cni;break;}
 }
 if(headerIndex<0){
  // Fallback for sheets whose date column is simply labelled "开始" or "日期/时间".
  for(let ri=0;ri<Math.min(rows.length,20);ri++){
   const candidate=rows[ri].map(x=>x.trim());
   const cdi=findCol(candidate,['日期','date','开始日期','开始日']);
   const cni=findCol(candidate,['活动','名称','事项','标题','event','title','program']);
   if(cdi>=0&&cni>=0){headerIndex=ri;h=candidate;di=cdi;ni=cni;break;}
  }
 }
 if(headerIndex<0){$('status').textContent='已读取公开表格，但找不到活动表头。请确认表格中有“活动名称”和“开始日期/日期”栏位。';return[];}
 ti=findCol(h,['开始时间','活动时间','时间','时段','time']);
 vi=findCol(h,['地点','场地','活动地点','venue','location']);
 ci=findCol(h,['类别','分类','组别','活动类别','category','type']);
 di2=findCol(h,['结束日期','活动结束日期','end date']);
 const parsed=[];
 for(const r of rows.slice(headerIndex+1)){
  let date=parseDate(r[di]);
  // Ignore blank rows and repeated headers; keep rows only when both date and activity title exist.
  if(!date)continue;
  const title=(r[ni]||'').trim();if(!title)continue;
  let time=ti>=0?(r[ti]||'').trim():'';
  // If the sheet has separate start/end time columns, show both.
  const endTime=findCol(h,['结束时间','完结时间','end time']);
  if(endTime>=0&&(r[endTime]||'').trim())time=time?time+' – '+r[endTime].trim():r[endTime].trim();
  const obj={date,title,time,venue:vi>=0?(r[vi]||'').trim():'',category:ci>=0?(r[ci]||'').trim():'',description:r.map((x,i)=>h[i]+': '+x).filter((x,i)=>r[i]&&i!==di&&i!==ni&&i!==ti&&i!==vi&&i!==ci).join('\n')};
  if(di2>=0)obj.endDate=parseDate(r[di2]);parsed.push(obj);
 }
 return parsed.sort((a,b)=>a.date-b.date);
}
function matches(e){let s=$('search').value.trim().toLowerCase(),c=$('category').value;return(!s||(e.title+' '+e.venue+' '+e.category+' '+e.description).toLowerCase().includes(s))&&(!c||e.category===c)}
function fmt(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function showEvent(e){$('modalTitle').textContent=e.title;$('modalBody').innerHTML='';[['日期',fmt(e.date)],['时间',e.time],['地点',e.venue],['类别',e.category],['详情',e.description]].forEach(([k,v])=>{if(v){let p=document.createElement('p');let b=document.createElement('strong');b.textContent=k+'：';p.append(b,document.createTextNode(v));$('modalBody').append(p)}});$('modal').classList.add('show')}
function eventButton(e){let b=document.createElement('button');b.className='event';b.textContent=e.title;if(e.time){let t=document.createElement('span');t.className='time';t.textContent=e.time;b.append(t)}b.onclick=()=>showEvent(e);return b}
function render(){let y=view.getFullYear(),m=view.getMonth();$('monthLabel').textContent=`${y}年${m+1}月`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=new Date();let root=$('days');root.innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let cell=document.createElement('div');cell.className='day'+(d.getMonth()!==m?' other':'')+(same(d,today)?' today':'');let n=document.createElement('div');n.className='num';n.textContent=d.getDate();cell.append(n);let es=events.filter(e=>same(e.date,d)&&matches(e));es.slice(0,3).forEach(e=>cell.append(eventButton(e)));if(es.length>3){let more=document.createElement('div');more.className='more';more.textContent=`另有 ${es.length-3} 项`;cell.append(more)}root.append(cell)}let list=events.filter(e=>matches(e)&&e.date>=new Date(today.getFullYear(),today.getMonth(),today.getDate())).slice(0,12);$('upcoming').innerHTML='';if(!list.length){$('upcoming').innerHTML='<div class="empty">目前没有符合条件的近期活动</div>'}list.forEach(e=>{let card=document.createElement('article');card.className='eventcard';let date=document.createElement('div');date.className='date';date.textContent=fmt(e.date)+(e.time?' · '+e.time:'');let title=document.createElement('h3');title.textContent=e.title;card.append(date,title);if(e.venue){let p=document.createElement('p');p.textContent='地点：'+e.venue;card.append(p)}if(e.category){let p=document.createElement('p');p.textContent=e.category;card.append(p)}card.onclick=()=>showEvent(e);card.style.cursor='pointer';$('upcoming').append(card)});$('status').textContent=`共载入 ${events.length} 项活动 · 资料来自公开 Google Sheet`}
async function load(){try{let u=CSV_URL+(CSV_URL.includes('?')?'&':'?')+'_='+Date.now();let res=await fetch(u,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let txt=await res.text();if(txt.trim().startsWith('<'))throw Error('Google 未返回 CSV 格式');events=parseEvents(txt);let cats=[...new Set(events.map(e=>e.category).filter(Boolean))].sort();cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').append(o)});render();if(!events.length)$('status').textContent='已读取资料，但暂时没有识别到活动。请核对表格栏位名称。'}catch(e){$('status').textContent='暂时无法读取公开表格。请确认 CSV 已发布为公开资料，并通过网站托管服务打开此页面（直接双击 HTML 可能受浏览器限制）。错误：'+e.message;$('days').innerHTML='<div class="empty" style="grid-column:1/-1">无法载入日历资料，请检查公开 CSV 链接或网络连接。</div>'}}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('today').onclick=()=>{view=new Date();view.setDate(1);render()};$('search').oninput=render;$('category').onchange=render;$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};load();setInterval(load,5*60*1000);
</script></body></html>
