
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 年活动日历</title>

<style>
:root {
  --green: #376b5b;
  --light-green: #e7f1ec;
  --ink: #273444;
  --muted: #6b7280;
  --line: #e5e7eb;
  --bg: #f4f6f5;
  --gold: #c58d45;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI",
    "Microsoft YaHei", sans-serif;
}
header {
  background: linear-gradient(135deg,#244f45,#477a68);
  color: white;
  padding: 28px 18px 24px;
  text-align: center;
}
header h1 {
  margin: 0;
  font-size: clamp(25px,4vw,36px);
  letter-spacing: .06em;
}
header p { margin: 8px 0 0; color: #e4eee9; }

main {
  max-width: 1200px;
  margin: 22px auto;
  padding: 0 16px 40px;
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 16px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
button,input {
  font: inherit;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 9px 12px;
  background: white;
  color: var(--ink);
}
button { cursor: pointer; }
button.primary {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
button:disabled { opacity: .6; cursor: wait; }
#monthLabel {
  font-size: 20px;
  font-weight: 700;
  min-width: 135px;
  text-align: center;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0,1.7fr) minmax(280px,1fr);
  gap: 16px;
}
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  min-width: 0;
}
.panel-head {
  padding: 15px 17px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}
.panel-head h2 { font-size: 17px; margin: 0; }
.status { font-size: 12px; color: var(--muted); }

.calendar { padding: 12px; }
.weekdays,.days {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  gap: 5px;
}
.weekdays div {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 8px 0;
}
.day {
  border: 1px solid #edf0ef;
  min-height: 100px;
  border-radius: 9px;
  padding: 6px;
  background: white;
  cursor: pointer;
  overflow: hidden;
  min-width: 0;
}
.day:hover { border-color: #8bb4a4; background: #fbfdfc; }
.day.outside { background: #f8f9f8; color: #a6adb4; }
.day.today { border: 2px solid var(--gold); }
.day.selected { background: var(--light-green); border-color: var(--green); }
.daynum { font-size: 13px; font-weight: 700; margin-bottom: 5px; }
.event-chip {
  display: block;
  background: #e8f1ed;
  color: #285c4c;
  border-left: 3px solid #548b76;
  border-radius: 4px;
  padding: 3px 4px;
  margin: 3px 0;
  font-size: 11px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}
.event-chip.more {
  background: #f3f4f6;
  color: #59616b;
  border-left-color: #9ca3af;
}
.side-content { padding: 14px 16px; }
.event-list { display: flex; flex-direction: column; gap: 10px; }
.event {
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.event h3 { margin: 5px 0; font-size: 15px; }
.event p {
  margin: 4px 0;
  color: #586270;
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.event .date { font-size: 12px; font-weight: 700; color: var(--green); }
.empty { padding: 25px 10px; text-align: center; color: var(--muted); }
.error {
  margin: 12px 0;
  padding: 12px 14px;
  background: #fff1f0;
  color: #9f2d25;
  border: 1px solid #ffd2ce;
  border-radius: 10px;
  display: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.footnote {
  color: var(--muted);
  font-size: 12px;
  margin-top: 14px;
  line-height: 1.5;
}
.pill {
  display: inline-block;
  font-size: 10px;
  border-radius: 20px;
  padding: 2px 6px;
  background: #f4eadb;
  color: #86591c;
  margin-left: 3px;
}
@media(max-width:850px) {
  .layout { grid-template-columns: 1fr; }
  .day { min-height: 80px; padding: 4px; }
  .event-chip { font-size: 10px; }
  .toolbar { align-items: flex-start; }
  #monthLabel { min-width: 110px; }
}
@media(max-width:520px) {
  main { padding: 0 8px 25px; margin-top: 12px; }
  .calendar { padding: 5px; }
  .weekdays,.days { gap: 2px; }
  .day { min-height: 65px; border-radius: 5px; }
  .daynum { font-size: 12px; }
  .event-chip { font-size: 9px; padding: 2px; }
  .toolbar { padding: 10px; }
  .controls { gap: 5px; }
  button,input { padding: 8px; font-size: 13px; }
}
</style>
</head>

<body>
<header>
  <h1>2027 年活动日历</h1>
  <p>活动安排 · 日期查询 · 即时更新</p>
</header>

<main>
  <div class="toolbar">
    <div class="controls">
      <button id="prevBtn">‹ 上个月</button>
      <button id="todayBtn">今天</button>
      <button id="nextBtn">下个月 ›</button>
      <span id="monthLabel">2027 年 1 月</span>
    </div>
    <div class="controls">
      <input id="searchInput" type="search"
        placeholder="搜索活动、地点、负责人…" aria-label="搜索活动">
      <button id="refreshBtn" class="primary">刷新数据</button>
    </div>
  </div>

  <div id="errorBox" class="error" role="alert"></div>

  <div class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>月历</h2>
        <span id="loadStatus" class="status">正在载入活动…</span>
      </div>
      <div class="calendar">
        <div class="weekdays">
          <div>日</div><div>一</div><div>二</div><div>三</div>
          <div>四</div><div>五</div><div>六</div>
        </div>
        <div id="days" class="days"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="listTitle">本月活动</h2>
        <span id="resultCount" class="status"></span>
      </div>
      <div class="side-content">
        <div id="eventList" class="event-list">
          <div class="empty">正在载入…</div>
        </div>
        <div class="footnote">
          活动资料来自 Google Sheets。点击「刷新数据」读取最新资料。
          网站每 5 分钟自动检查更新。
        </div>
      </div>
    </section>
  </div>
</main>

<script>
"use strict";

/* Google Sheets CSV links */
const ACTIVITY_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv";

const DATE_INFO_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv";

let activities = [];
let dateInfo = [];
let viewDate = new Date(2027, 0, 1);
let selectedDate = "";
let searchTerm = "";

const $ = id => document.getElementById(id);
const clean = v => String(v ?? "").replace(/^\uFEFF/, "").trim();
const norm = v => clean(v).toLowerCase()
  .replace(/[\s_\-()（）:：/]+/g, "");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

/* Robust CSV parser: supports quoted commas, line breaks and escaped quotes */
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", quoted = false;
  text = String(text ?? "").replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (quoted) {
      if (c === '"' && text[i + 1] === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        quoted = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"' && field === "") {
        quoted = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field);
        if (row.some(v => clean(v) !== "")) rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }
  }

  row.push(field);
  if (row.some(v => clean(v) !== "")) rows.push(row);
  return rows;
}

function validDate(y, m, d) {
  const date = new Date(y, m - 1, d);
  return date.getFullYear() === y &&
    date.getMonth() === m - 1 &&
    date.getDate() === d ? date : null;
}

/* Handles common Google Sheets date formats */
function parseDate(value) {
  const s = clean(value);
  if (!s) return null;
  let m;

  // yyyy-mm-dd or yyyy/mm/dd
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|T|\s)/);
  if (m) return validDate(+m[1], +m[2], +m[3]);

  // dd/mm/yyyy or dd-mm-yyyy
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return validDate(+m[3], +m[2], +m[1]);

  const months = {
    jan:0,january:0,feb:1,february:1,mar:2,march:2,
    apr:3,april:3,may:4,jun:5,june:5,jul:6,july:6,
    aug:7,august:7,sep:8,sept:8,september:8,
    oct:9,october:9,nov:10,november:10,dec:11,december:11
  };

  // 13-Feb-27 or 13 Feb 2027
  m = s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s,\-\/]+(\d{2,4})$/);
  if (m && months[m[2].toLowerCase()] !== undefined) {
    let y = +m[3];
    if (y < 100) y += y < 50 ? 2000 : 1900;
    return validDate(y, months[m[2].toLowerCase()] + 1, +m[1]);
  }

  // Feb 13, 2027
  m = s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/);
  if (m && months[m[1].toLowerCase()] !== undefined) {
    return validDate(+m[3], months[m[1].toLowerCase()] + 1, +m[2]);
  }

  // Google Sheets serial date
  if (/^\d{5}(?:\.0+)?$/.test(s)) {
    const d = new Date(Date.UTC(1899,11,30) +
      Math.floor(Number(s)) * 86400000);
    return validDate(d.getUTCFullYear(), d.getUTCMonth()+1, d.getUTCDate());
  }

  const parsed = new Date(s);
  if (!isNaN(parsed)) {
    return validDate(parsed.getFullYear(),
      parsed.getMonth()+1, parsed.getDate());
  }
  return null;
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function fromKey(key) {
  const m = String(key).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
}

/* Locate a likely header row, including sheets with a title above the table */
function rowsToObjects(rows) {
  if (!rows.length) return [];

  let headerRow = 0, bestScore = -1;

  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const cells = rows[i].map(norm);
    const score = cells.filter(c =>
      /activity|event|活动|title|名称|startdate|开始日期|date|日期/.test(c)
    ).length;

    if (score > bestScore) {
      bestScore = score;
      headerRow = i;
    }
  }

  const headers = rows[headerRow].map(clean);

  return rows.slice(headerRow + 1)
    .filter(r => r.some(v => clean(v) !== ""))
    .map(r => {
      const obj = {};
      headers.forEach((h, i) => {
        if (h) obj[h] = clean(r[i]);
      });
      return obj;
    });
}

function getValue(obj, patterns) {
  const entry = Object.entries(obj).find(([key, value]) =>
    patterns.some(p => p.test(norm(key))) && clean(value) !== ""
  );
  return entry ? clean(entry[1]) : "";
}

function detectActivities(rows) {
  const objects = rowsToObjects(rows);

  return objects.map((obj, i) => {
    const title = getValue(obj, [
      /^(activity|event|活动名称|活动|title|name|eventname|activityname)$/,
      /activityname/, /eventname/, /活动名称/
    ]);

    const startRaw = getValue(obj, [
      /^(startdate|start|date|日期|开始日期|活动日期|eventdate)$/,
      /startdate/, /开始日期/, /活动日期/, /^date$/
    ]);

    const endRaw = getValue(obj, [
      /^(enddate|end|结束日期)$/, /enddate/, /结束日期/
    ]);

    const enabled = getValue(obj, [
      /^(enabled|active|status|启用|状态|是否启用)$/,
      /enabled/, /active/
    ]);

    const category = getValue(obj, [
      /^(category|type|类别|类型|分类)$/, /category/, /类别/, /类型/
    ]);
    const location = getValue(obj, [
      /^(location|venue|地点|场地)$/, /location/, /venue/, /地点/, /场地/
    ]);
    const owner = getValue(obj, [
      /^(owner|personincharge|负责人|负责人员|联系人)$/,
      /owner/, /负责人/, /联系人/
    ]);
    const description = getValue(obj, [
      /^(description|details|备注|说明|内容)$/,
      /description/, /details/, /备注/, /说明/
    ]);
    const recurrence = getValue(obj, [
      /^(recurrence|repeat|重复|重复规则)$/,
      /recurrence/, /repeat/, /重复/
    ]);

    const start = parseDate(startRaw);
    const end = parseDate(endRaw) || start;

    if (!title || !start) return null;
    if (/^(false|no|n|0|inactive|disabled|否|停用)$/i.test(enabled)) {
      return null;
    }

    return {
      id: "a" + i, title, start, end, category,
      location, owner, description, recurrence
    };
  }).filter(Boolean);
}

/* Expand multi-day and recurring activities */
function expandActivities(items) {
  const expanded = [];

  for (const a of items) {
    const start = a.start;
    const end = a.end || start;
    const rule = (a.recurrence || "").toLowerCase();

    if (!rule || /^(none|no|never|无|不重复|一次|one.?time)$/i.test(rule)) {
      for (let d = new Date(start), count = 0;
        d <= end && count < 370;
        d = addDays(d, 1), count++) {
        expanded.push({...a, date:dateKey(d)});
      }
      continue;
    }

    const mode =
      /daily|每天|每日|日重复/.test(rule) ? "daily" :
      /weekly|每周|星期|周重复/.test(rule) ? "weekly" :
      /monthly|每月|月重复/.test(rule) ? "monthly" : "";

    if (!mode) {
      expanded.push({...a, date:dateKey(start)});
      continue;
    }

    const lastDate = end > start ? end : new Date(2027, 11, 31);
    const stop = new Date(Math.min(
      lastDate.getTime(), new Date(2028,11,31).getTime()
    ));

    for (let d = new Date(start), count = 0;
      d <= stop && count < 500;
      d = addDays(d, 1), count++) {
      const match = mode === "daily" ||
        (mode === "weekly" && d.getDay() === start.getDay()) ||
        (mode === "monthly" && d.getDate() === start.getDate());

      if (match) expanded.push({...a, date:dateKey(d)});
    }
  }

  return expanded;
}

function parseDateInfo(rows) {
  return rowsToObjects(rows).map(obj => {
    const raw = getValue(obj, [
      /^(date|日期|公历日期|gregoriandate)$/, /date/, /日期/
    ]);
    const date = parseDate(raw);
    if (!date) return null;

    return {
      date: dateKey(date),
      lunar: getValue(obj, [/^(lunar|lunarcalendar|农历|农历日期)$/, /lunar/, /农历/]),
      holiday: getValue(obj, [/^(holiday|publicholiday|节日|公共假期|假期)$/, /holiday/, /节日/, /假期/]),
      note: getValue(obj, [/^(note|备注|说明)$/, /note/, /备注/])
    };
  }).filter(Boolean);
}

async function fetchCSV(url) {
  const response = await fetch(url, {cache:"no-store"});

  if (!response.ok) {
    throw new Error(`HTTP ${response.status} ${response.statusText}`);
  }

  const text = await response.text();
  const trimmed = text.trim();

  if (!trimmed) throw new Error("CSV 内容为空。");

  if (/^<!doctype html/i.test(trimmed) || /^<html/i.test(trimmed)) {
    throw new Error("Google Sheets 返回 HTML，而不是 CSV。请检查发布设置。");
  }

  return parseCSV(text);
}

async function loadData() {
  $("refreshBtn").disabled = true;
  $("loadStatus").textContent = "正在载入…";
  $("errorBox").style.display = "none";

  try {
    const activityRows = await fetchCSV(ACTIVITY_CSV_URL);
    const parsed = detectActivities(activityRows);

    if (!parsed.length) {
      console.error("CSV 前几行：", activityRows.slice(0, 15));
      throw new Error(
        "已连接 CSV，但找不到可识别的活动日期或活动名称。请检查表头。"
      );
    }

    activities = expandActivities(parsed);

    // Date information is optional. Failure here should not hide activities.
    try {
      dateInfo = parseDateInfo(await fetchCSV(DATE_INFO_CSV_URL));
    } catch (dateError) {
      console.warn("日期附加资料无法载入：", dateError);
      dateInfo = [];
    }

    $("loadStatus").textContent = `成功载入 ${parsed.length} 项活动`;
    render();

  } catch (error) {
    console.error("Calendar loading error:", error);
    $("loadStatus").textContent = "载入失败";
    $("errorBox").textContent =
      "活动资料载入失败：\n" + error.message +
      "\n\n如果出现 Failed to fetch，可能是浏览器跨站请求（CORS）问题。" +
      "如果提示找不到活动，则需要根据实际 CSV 表头调整识别规则。";
    $("errorBox").style.display = "block";
    $("eventList").innerHTML =
      '<div class="empty">暂时无法显示活动。请检查资料连接后再刷新。</div>';
  } finally {
    $("refreshBtn").disabled = false;
  }
}

function infoFor(key) {
  return dateInfo.find(x => x.date === key);
}
function matchesSearch(a) {
  return !searchTerm ||
    [a.title,a.category,a.location,a.owner,a.description]
      .join(" ").toLowerCase().includes(searchTerm);
}
function activityOn(key) {
  return activities.filter(a => a.date === key && matchesSearch(a));
}

function renderCalendar() {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();

  $("monthLabel").textContent = `${year} 年 ${month+1} 月`;

  const first = new Date(year, month, 1);
  const start = addDays(first, -first.getDay());
  const todayKey = dateKey(new Date());
  let html = "";

  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const key = dateKey(d);
    const inMonth = d.getMonth() === month;
    const evs = activityOn(key);
    const info = infoFor(key);

    const classes = "day" +
      (!inMonth ? " outside" : "") +
      (key === todayKey ? " today" : "") +
      (key === selectedDate ? " selected" : "");

    html += `
      <div class="${classes}" data-date="${key}"
        tabindex="0" role="button" aria-label="${key}">
        <div class="daynum">${d.getDate()}
          ${info && info.holiday ? '<span class="pill">假期</span>' : ""}
        </div>
        ${info && info.lunar
          ? `<div style="font-size:10px;color:#8a929b;margin-bottom:3px">${escapeHTML(info.lunar)}</div>`
          : ""}
        ${evs.slice(0,3).map(e =>
          `<span class="event-chip" title="${escapeHTML(e.title)}">${escapeHTML(e.title)}</span>`
        ).join("")}
        ${evs.length > 3
          ? `<span class="event-chip more">另有 ${evs.length-3} 项</span>`
          : ""}
        ${info && info.holiday
          ? `<div style="font-size:10px;color:#9a6a2d">${escapeHTML(info.holiday)}</div>`
          : ""}
      </div>`;
  }

  $("days").innerHTML = html;

  $("days").querySelectorAll(".day").forEach(el => {
    const choose = () => {
      selectedDate = el.dataset.date;
      render();
    };
    el.addEventListener("click", choose);
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        choose();
      }
    });
  });
}

function eventCard(a) {
  const d = fromKey(a.date);
  const dateText = d ? d.toLocaleDateString("zh-MY", {
    year:"numeric", month:"short", day:"numeric", weekday:"short"
  }) : a.date;

  return `<article class="event">
    <div class="date">${dateText}</div>
    <h3>${escapeHTML(a.title)}</h3>
    ${a.category ? `<p>类别：${escapeHTML(a.category)}</p>` : ""}
    ${a.location ? `<p>地点：${escapeHTML(a.location)}</p>` : ""}
    ${a.owner ? `<p>负责人：${escapeHTML(a.owner)}</p>` : ""}
    ${a.description ? `<p>${escapeHTML(a.description)}</p>` : ""}
  </article>`;
}

function renderList() {
  const all = activities.filter(matchesSearch);
  let list, title;

  if (selectedDate) {
    list = all.filter(a => a.date === selectedDate);
    title = `${selectedDate} 的活动`;
  } else {
    list = all.filter(a => {
      const d = fromKey(a.date);
      return d &&
        d.getFullYear() === viewDate.getFullYear() &&
        d.getMonth() === viewDate.getMonth();
    });
    title = searchTerm ? "搜索结果" :
      `${viewDate.getFullYear()} 年 ${viewDate.getMonth()+1} 月活动`;
  }

  list.sort((a,b) => a.date.localeCompare(b.date) ||
    a.title.localeCompare(b.title));

  $("listTitle").textContent = title;
  $("resultCount").textContent = `${list.length} 项`;

  if (!list.length) {
    $("eventList").innerHTML =
      `<div class="empty">${searchTerm
        ? "没有找到符合条件的活动。"
        : "这一天 / 这个月份暂时没有活动。"
      }</div>`;
    return;
  }

  $("eventList").innerHTML = list.slice(0,150).map(eventCard).join("") +
    (list.length > 150
      ? '<div class="empty">仅显示前 150 项，请缩小搜索范围。</div>'
      : "");
}

function render() {
  renderCalendar();
  renderList();
}

$("prevBtn").addEventListener("click", () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
  selectedDate = "";
  render();
});

$("nextBtn").addEventListener("click", () => {
  viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
  selectedDate = "";
  render();
});

$("todayBtn").addEventListener("click", () => {
  const now = new Date();
  viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
  selectedDate = dateKey(now);
  render();
});

$("refreshBtn").addEventListener("click", loadData);
$("searchInput").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
