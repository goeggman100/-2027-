
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f5ed">
  <meta name="description" content="美里佛教居士林 2027 年度活动日历">
  <title>美里佛教居士林｜2027 年度活动日历</title>

  <style>
    :root {
      --gold: #a98646;
      --gold-light: #d9c59a;
      --green: #354e42;
      --green-light: #e9eee7;
      --cream: #f8f5ed;
      --paper: #fffdf8;
      --ink: #333b34;
      --muted: #777b72;
      --line: #e9e2d3;
      --shadow: 0 8px 28px rgba(62, 55, 37, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family:
        "Noto Sans SC",
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
      line-height: 1.6;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ===== Header & Logo ===== */

    .site-header {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 24px 28px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);

      /* 不裁切 Logo */
      overflow: visible;
    }

    .logo-frame {
      flex: 0 0 104px;
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .site-logo {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;

      /* 关键：完整显示整张 Logo */
      object-fit: contain;
      object-position: center;

      flex-shrink: 0;
      border: 0;
      border-radius: 0;
      overflow: visible;
    }

    .logo-placeholder {
      display: none;
      width: 100%;
      height: 100%;
      border: 1px dashed var(--gold-light);
      border-radius: 12px;
      color: var(--gold);
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      padding: 8px;
    }

    .site-heading {
      min-width: 0;
    }

    .site-heading h1 {
      margin: 0;
      font-size: clamp(23px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--green);
      line-height: 1.35;
    }

    .english-name {
      margin: 5px 0 8px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 2px;
    }

    .site-subtitle {
      display: inline-block;
      padding: 4px 12px;
      background: var(--green-light);
      color: var(--green);
      border-radius: 20px;
      font-size: 13px;
    }

    /* ===== Banner ===== */

    .welcome-banner {
      position: relative;
      margin-top: 20px;
      padding: 28px 30px;
      overflow: hidden;
      border-radius: 18px;
      color: #fffdf5;
      background:
        radial-gradient(
          circle at 90% 20%,
          rgba(217, 197, 154, 0.3),
          transparent 35%
        ),
        linear-gradient(120deg, #354e42, #667b62);
    }

    .welcome-banner::after {
      content: "☸";
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 100px;
      opacity: 0.12;
      pointer-events: none;
    }

    .welcome-banner h2 {
      margin: 0 0 8px;
      font-size: clamp(21px, 3vw, 29px);
      font-weight: 500;
      letter-spacing: 1px;
    }

    .welcome-banner p {
      margin: 0;
      color: #eee7d6;
      font-size: 14px;
    }

    /* ===== Toolbar ===== */

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
    }

    .search-box {
      flex: 1 1 240px;
      min-width: 0;
      position: relative;
    }

    .search-box input {
      width: 100%;
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(169, 134, 70, 0.1);
    }

    .btn {
      min-height: 44px;
      padding: 9px 15px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      color: var(--green);
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: var(--green-light);
    }

    .btn-primary {
      color: white;
      background: var(--green);
      border-color: var(--green);
    }

    .btn-primary:hover {
      background: #263b31;
    }

    /* ===== Calendar ===== */

    .calendar-panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .calendar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .calendar-heading h2 {
      margin: 0;
      color: var(--green);
      font-size: 25px;
    }

    .month-controls {
      display: flex;
      gap: 8px;
    }

    .month-controls button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--green);
      font-size: 20px;
    }

    .month-controls button:hover {
      background: var(--green-light);
    }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays {
      border-bottom: 1px solid var(--line);
      margin-bottom: 8px;
    }

    .weekday {
      padding: 12px 2px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .weekday:first-child {
      color: #b36c60;
    }

    .weekday:last-child {
      color: #6885a4;
    }

    .day-cell {
      min-width: 0;
      min-height: 118px;
      padding: 8px;
      border-right: 1px solid #f0ebdf;
      border-bottom: 1px solid #f0ebdf;
      background: transparent;
    }

    .day-cell:nth-child(7n) {
      border-right: 0;
    }

    .day-cell.other-month {
      background: #faf8f2;
      color: #b8b5aa;
    }

    .day-cell.today {
      background: #f5f0df;
    }

    .day-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 29px;
      height: 29px;
      margin-bottom: 6px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 600;
    }

    .today .day-number {
      color: white;
      background: var(--green);
    }

    .event {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 5px 6px;
      border: 0;
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      background: #f3eee1;
      color: #5e4b2d;
      text-align: left;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .event:hover {
      background: #e8ddc4;
    }

    .event-time {
      display: block;
      font-size: 10px;
      opacity: 0.8;
    }

    .more-events {
      display: block;
      margin-top: 4px;
      color: var(--green);
      font-size: 11px;
    }

    /* ===== Search results & details ===== */

    .section-title {
      margin: 26px 0 12px;
      color: var(--green);
      font-size: 19px;
    }

    .results-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-card {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
    }

    .result-date {
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
    }

    .result-card h3 {
      margin: 5px 0;
      color: var(--green);
      font-size: 17px;
    }

    .result-card p {
      margin: 5px 0;
      font-size: 13px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .empty-state {
      padding: 30px 12px;
      text-align: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    .status {
      margin: 12px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .status.error {
      color: #a33d32;
    }

    .footer {
      padding: 28px 8px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    .footer strong {
      color: var(--green);
    }

    /* ===== Mobile ===== */

    @media (max-width: 700px) {
      .page {
        padding: 12px;
      }

      .site-header {
        gap: 14px;
        padding: 17px;
        border-radius: 15px;
      }

      .logo-frame {
        flex-basis: 76px;
        width: 76px;
        height: 76px;
      }

      .site-heading h1 {
        font-size: 21px;
        letter-spacing: 0;
      }

      .english-name {
        font-size: 9px;
        letter-spacing: 1px;
      }

      .site-subtitle {
        font-size: 11px;
      }

      .welcome-banner {
        padding: 23px 19px;
      }

      .welcome-banner::after {
        right: 8px;
        font-size: 70px;
      }

      .calendar-panel {
        padding: 12px 7px;
      }

      .calendar-heading {
        padding: 0 5px;
      }

      .calendar-heading h2 {
        font-size: 20px;
      }

      .day-cell {
        min-height: 78px;
        padding: 3px;
      }

      .day-number {
        width: 24px;
        height: 24px;
        font-size: 11px;
      }

      .event {
        padding: 4px 3px;
        font-size: 10px;
        border-left-width: 2px;
      }

      .event-time {
        display: none;
      }

      .weekday {
        font-size: 11px;
        padding: 9px 0;
      }

      .results-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 380px) {
      .logo-frame {
        flex-basis: 62px;
        width: 62px;
        height: 62px;
      }

      .site-header {
        gap: 10px;
        padding: 13px;
      }

      .site-heading h1 {
        font-size: 18px;
      }

      .day-cell {
        min-height: 66px;
      }

      .event {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="site-header">
      <div class="logo-frame">
        <img
          src="./logo.png"
          alt="美里佛教居士林 Logo"

          id="siteLogo"
        >

        </div>

        <div class="month-controls">

    <footer class="footer">

      <p>活动资料以居士林最新公布为准。</p>

  </main>

  <script>
    "use strict";

    /* ==========================================
       Google Sheets CSV 来源
       ========================================== */

    const ACTIVITY_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv";

    const DATE_INFO_CSV_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv";

    const AUTO_REFRESH_MS = 5 * 60 * 1000;
    const MAX_EVENTS_PER_DAY = 3;

    let activities = [];
    let dateInfo = new Map();
    let viewDate = new Date(2027, 0, 1);
    let searchTerm = "";
    let showingSearchResults = false;
    let lastUpdated = null;

    const $ = id => document.getElementById(id);

    /* ==========================================
       Logo 错误处理
       ========================================== */

    $("siteLogo").addEventListener("error", () => {
      $("siteLogo").style.display = "none";
      $("logoPlaceholder").style.display = "flex";
    });

    $("siteLogo").addEventListener("load", () => {
      $("siteLogo").style.display = "block";
      $("logoPlaceholder").style.display = "none";
    });

    /* ==========================================
       CSV 解析器：处理逗号、引号、换行
       ========================================== */

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      text = text.replace(/^\uFEFF/, "");

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            field += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === "," && !inQuotes) {
          row.push(field.trim());
          field = "";
        } else if (
          (char === "\n" || char === "\r") &&
          !inQuotes
        ) {
          if (char === "\r" && next === "\n") i++;

          row.push(field.trim());

          if (row.some(value => value !== "")) {
            rows.push(row);
          }

          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      row.push(field.trim());

      if (row.some(value => value !== "")) {
        rows.push(row);
      }

      return rows;
    }

    function normalizeHeader(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[\s_\-（）()【】\[\]：:]/g, "");
    }

    function findColumn(headers, candidates) {
      const normalized = headers.map(normalizeHeader);

      for (const candidate of candidates) {
        const index = normalized.indexOf(normalizeHeader(candidate));
        if (index !== -1) return index;
      }

      return -1;
    }

    function detectHeaderRow(rows) {
      const candidates = [
        "日期", "date", "活动", "活动名称",
        "event", "title", "事项", "内容"
      ];

      const scanLimit = Math.min(rows.length, 10);

      for (let i = 0; i < scanLimit; i++) {
        const values = rows[i].map(normalizeHeader);
        const matches = candidates.filter(candidate =>
          values.includes(normalizeHeader(candidate))
        );

        if (matches.length >= 1) {
          return i;
        }
      }

      return 0;
    }

    /* ==========================================
       日期解析：支持常见日期格式
       ========================================== */

    function makeDate(year, month, day) {
      if (
        !Number.isInteger(year) ||
        !Number.isInteger(month) ||
        !Number.isInteger(day)
      ) return null;

      const result = new Date(year, month - 1, day);

      if (
        result.getFullYear() !== year ||
        result.getMonth() !== month - 1 ||
        result.getDate() !== day
      ) return null;

      return result;
    }

    function parseDate(value) {
      if (value === null || value === undefined) return null;

      const raw = String(value).trim();
      if (!raw) return null;

      // Excel / Google Sheets serial date
      if (/^\d{5}(\.\d+)?$/.test(raw)) {
        const serial = Number(raw);

        if (serial > 20000 && serial < 80000) {
          const date = new Date(
            Date.UTC(1899, 11, 30) +
            Math.floor(serial) * 86400000
          );

          return makeDate(
            date.getUTCFullYear(),
            date.getUTCMonth() + 1,
            date.getUTCDate()
          );
        }
      }

      // YYYY-MM-DD, YYYY/MM/DD, YYYY.MM.DD
      let match = raw.match(
        /^(\d{4})[-/.年]\s*(\d{1,2})[-/.月]\s*(\d{1,2})日?$/
      );

      if (match) {
        return makeDate(+match[1], +match[2], +match[3]);
      }

      // DD/MM/YYYY or MM/DD/YYYY
      match = raw.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);

      if (match) {
        const a = +match[1];
        const b = +match[2];
        const year = +match[3];

        // Prefer DD/MM/YYYY for Malaysian dates.
        if (a > 12) return makeDate(year, b, a);
        if (b > 12) return makeDate(year, a, b);

        return makeDate(year, b, a);
      }

      // D Month YYYY, e.g. 5 Jan 2027
      const monthNames = {
        jan: 1, january: 1,
        feb: 2, february: 2,
        mar: 3, march: 3,
        apr: 4, april: 4,
        may: 5,
        jun: 6, june: 6,
        jul: 7, july: 7,
        aug: 8, august: 8,
        sep: 9, sept: 9, september: 9,
        oct: 10, october: 10,
        nov: 11, november: 11,
        dec: 12, december: 12
      };

      match = raw.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/);

      if (match && monthNames[match[2].toLowerCase()]) {
        return makeDate(
          +match[3],
          monthNames[match[2].toLowerCase()],
          +match[1]
        );
      }

      return null;
    }

    function dateKey(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("zh-MY", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(date);
    }

    function formatTime(value) {
      return String(value || "").trim();
    }

    /* ==========================================
       识别活动表格的栏位
       ========================================== */

    function rowsToObjects(rows) {
      if (!rows.length) return [];

      const headerIndex = detectHeaderRow(rows);
      const headers = rows[headerIndex];

      const dateCol = findColumn(headers, [
        "日期", "活动日期", "举办日期",
        "date", "eventdate", "activitydate"
      ]);

      const titleCol = findColumn(headers, [
        "活动名称", "活动", "事项", "内容",
        "event", "eventname", "title",
        "activity", "activityname"
      ]);

      const timeCol = findColumn(headers, [
        "时间", "活动时间", "time", "eventtime"
      ]);

      const locationCol = findColumn(headers, [
        "地点", "场地", "活动地点", "location", "venue"
      ]);

      const personCol = findColumn(headers, [
        "负责人", "联络人", "联系人", "负责单位",
        "personincharge", "contact", "coordinator"
      ]);

      const descriptionCol = findColumn(headers, [
        "备注", "说明", "详情", "描述",
        "remark", "remarks", "description", "details"
      ]);

      if (dateCol === -1) {
        throw new Error(
          "活动表格找不到日期栏位。请检查第一行是否有「日期」或 Date。"
        );
      }

      const result = [];

      for (let i = headerIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        const dateText = row[dateCol] || "";
        const title = titleCol >= 0 ? row[titleCol] : "";

        if (!dateText.trim() || !title.trim()) continue;

        const date = parseDate(dateText);

        if (!date) continue;

        const activity = {
          date,
          title: title.trim(),
          time: timeCol >= 0 ? formatTime(row[timeCol]) : "",
          location: locationCol >= 0 ? (row[locationCol] || "").trim() : "",
          person: personCol >= 0 ? (row[personCol] || "").trim() : "",
          description:
            descriptionCol >= 0 ? (row[descriptionCol] || "").trim() : ""
        };

        result.push(activity);
      }

      return result;
    }

    /* ==========================================
       可选日期资料表
       将日期相关资料与日历日期对应
       ========================================== */

    function parseDateInfo(rows) {
      const result = new Map();

      if (!rows.length) return result;

      const headerIndex = detectHeaderRow(rows);
      const headers = rows[headerIndex];

      const dateCol = findColumn(headers, [
        "日期", "date", "活动日期"
      ]);

      const titleCol = findColumn(headers, [
        "节日", "日期名称", "主题", "名称",
        "event", "title", "holiday", "occasion"
      ]);

      const noteCol = findColumn(headers, [
        "备注", "说明", "note", "notes", "description"
      ]);

      if (dateCol === -1) return result;

      for (let i = headerIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        const date = parseDate(row[dateCol]);

        if (!date) continue;

        const key = dateKey(date);
        const parts = [];

        if (titleCol >= 0 && row[titleCol]) {
          parts.push(row[titleCol].trim());
        }

        if (noteCol >= 0 && row[noteCol]) {
          parts.push(row[noteCol].trim());
        }

        if (parts.length) {
          const existing = result.get(key) || [];
          result.set(key, [...existing, ...parts]);
        }
      }

      return result;
    }

    /* ==========================================
       读取 Google Sheets
       ========================================== */

    async function fetchCSV(url) {
      const response = await fetch(
        url + "&_=" + Date.now(),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("读取资料失败，HTTP " + response.status);
      }

      const text = await response.text();

      if (
        text.trim().startsWith("<!DOCTYPE html") ||
        text.trim().startsWith("<html")
      ) {
        throw new Error("Google Sheets 没有返回 CSV，请检查发布权限。");
      }

      return parseCSV(text);
    }

    async function loadData() {
      const status = $("status");
      const refreshButton = $("refreshBtn");

      refreshButton.disabled = true;
      status.classList.remove("error");
      status.textContent = "正在更新 Google Sheets 资料……";

      try {
        const activityRows = await fetchCSV(ACTIVITY_CSV_URL);
        const loadedActivities = rowsToObjects(activityRows);

        let loadedDateInfo = new Map();
        let dateInfoMessage = "";

        try {
          const dateRows = await fetchCSV(DATE_INFO_CSV_URL);
          loadedDateInfo = parseDateInfo(dateRows);
        } catch (error) {
          dateInfoMessage = "；日期附加资料暂时无法读取";
          console.warn("日期附加资料读取失败：", error);
        }

        activities = loadedActivities.sort(
          (a, b) =>
            a.date - b.date ||
            a.time.localeCompare(b.time, "zh")
        );

        dateInfo = loadedDateInfo;
        lastUpdated = new Date();

        renderCalendar();
        renderResults();

        status.textContent =
          "资料已更新：" +
          lastUpdated.toLocaleTimeString("zh-MY", {
            hour: "2-digit",
            minute: "2-digit"
          }) +
          "｜共 " + activities.length + " 项活动" +
          dateInfoMessage;

      } catch (error) {
        console.error(error);
        status.classList.add("error");
        status.textContent =
          "资料读取失败：" + error.message +
          "。请确认 Google Sheets 已发布为 CSV，并检查网络连接。";

        if (activities.length === 0) {
          $("calendarGrid").innerHTML =
            '<div class="empty-state" style="grid-column:1/-1">' +
            "暂时无法载入活动资料，请稍后刷新。" +
            "</div>";
        }
      } finally {
        refreshButton.disabled = false;
      }
    }

    /* ==========================================
       活动筛选
       ========================================== */

    function matchesSearch(activity) {
      if (!searchTerm) return true;

      const combined = [
        activity.title,
        activity.time,
        activity.location,
        activity.person,
        activity.description,
        formatDate(activity.date)
      ].join(" ").toLowerCase();

      return combined.includes(searchTerm.toLowerCase());
    }

    function getFilteredActivities() {
      return activities.filter(matchesSearch);
    }

    function activitiesOn(date) {
      const key = dateKey(date);

      return activities.filter(activity =>
        dateKey(activity.date) === key &&
        matchesSearch(activity)
      );
    }

    /* ==========================================
       安全输出文字，避免把表格内容当 HTML
       ========================================== */

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    /* ==========================================
       绘制月历
       ========================================== */

    function renderCalendar() {
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      $("monthTitle").textContent = year + " 年 " + (month + 1) + " 月";

      const firstDay = new Date(year, month, 1);
      const start = new Date(year, month, 1 - firstDay.getDay());
      const today = dateKey(new Date());

      const cells = [];

      for (let i = 0; i < 42; i++) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);

        const isCurrentMonth = date.getMonth() === month;
        const isToday = dateKey(date) === today;
        const events = activitiesOn(date);
        const notes = dateInfo.get(dateKey(date)) || [];

        const classes = [
          "day-cell",
          isCurrentMonth ? "" : "other-month",
          isToday ? "today" : ""
        ].filter(Boolean).join(" ");

        let eventHTML = "";

        events.slice(0, MAX_EVENTS_PER_DAY).forEach(event => {
          eventHTML += `
            <button class="event"
              type="button"
              data-date="${escapeHTML(dateKey(date))}"
              title="${escapeHTML(event.title)}">
              ${escapeHTML(event.title)}
              ${event.time
                ? `<span class="event-time">${escapeHTML(event.time)}</span>`
                : ""}
            </button>
          `;
        });

        if (events.length > MAX_EVENTS_PER_DAY) {
          eventHTML += `
            <span class="more-events">
              另有 ${events.length - MAX_EVENTS_PER_DAY} 项
            </span>
          `;
        }

        if (notes.length) {
          eventHTML += notes.map(note => `
            <span class="more-events">
              ${escapeHTML(note)}
            </span>
          `).join("");
        }

        cells.push(`
          <div class="${classes}">
            <div class="day-number">${date.getDate()}</div>
            ${eventHTML}
          </div>
        `);
      }

      $("calendarGrid").innerHTML = cells.join("");

      $("calendarGrid").querySelectorAll(".event").forEach(button => {
        button.addEventListener("click", () => {
          const key = button.dataset.date;
          const eventDate = parseDate(key);

          if (eventDate) {
            renderResults(eventDate);
            $("resultsSection").scrollIntoView({
              behavior: "smooth",
              block: "start"
            });
          }
        });
      });
    }

    /* ==========================================
       活动列表
       ========================================== */

    function renderResults(selectedDate = null) {
      let list = getFilteredActivities();

      if (selectedDate) {
        const key = dateKey(selectedDate);
        list = list.filter(item => dateKey(item.date) === key);
        $("resultsTitle").textContent = formatDate(selectedDate) + " · 活动";
      } else if (searchTerm) {
        $("resultsTitle").textContent =
          "搜索结果（" + list.length + " 项）";
      } else {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();

        list = list.filter(item =>
          item.date.getFullYear() === year &&
          item.date.getMonth() === month
        );

        $("resultsTitle").textContent =
          year + " 年 " + (month + 1) + " 月 · 活动列表";
      }

      if (!list.length) {
        $("resultsList").innerHTML =
          '<div class="empty-state">这个范围内没有找到活动。</div>';
        return;
      }

      $("resultsList").innerHTML = list.map(activity => `
        <article class="result-card">
          <div class="result-date">
            ${escapeHTML(formatDate(activity.date))}
            ${activity.time
              ? " · " + escapeHTML(activity.time)
              : ""}
          </div>
          <h3>${escapeHTML(activity.title)}</h3>
          ${activity.location
            ? `<p>📍 ${escapeHTML(activity.location)}</p>`
            : ""}
          ${activity.person
            ? `<p>👤 ${escapeHTML(activity.person)}</p>`
            : ""}
          ${activity.description
            ? `<p>${escapeHTML(activity.description)}</p>`
            : ""}
        </article>
      `).join("");
    }

    /* ==========================================
       操作按钮
       ========================================== */

    $("prevMonth").addEventListener("click", () => {
      viewDate = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() - 1,
        1
      );

      showingSearchResults = false;
      renderCalendar();
      renderResults();
    });

    $("nextMonth").addEventListener("click", () => {
      viewDate = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() + 1,
        1
      );

      showingSearchResults = false;
      renderCalendar();
      renderResults();
    });

    $("todayBtn").addEventListener("click", () => {
      const today = new Date();

      viewDate = new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

      searchTerm = "";
      $("searchInput").value = "";
      showingSearchResults = false;

      renderCalendar();
      renderResults();
    });

    $("refreshBtn").addEventListener("click", loadData);

    $("searchInput").addEventListener("input", event => {
      searchTerm = event.target.value.trim();
      showingSearchResults = true;
      renderCalendar();
      renderResults();
    });

    $("listBtn").addEventListener("click", () => {
      $("resultsSection").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    });

    /* ==========================================
       初始化
       ========================================== */

    renderCalendar();
    renderResults();
    loadData();

    // 每五分钟自动刷新
    setInterval(loadData, AUTO_REFRESH_MS);
  </script>
</body>
</html>
