<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>美里佛教居士林｜2027全年活动日历</title>
<style>
:root{--ink:#24382f;--muted:#78847b;--paper:#fbfaf6;--green:#476b55;--sage:#e8efe6;--line:#e6e8e1;--gold:#b48b4e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 50px}.hero{padding:26px 26px 22px;border-radius:22px;background:linear-gradient(135deg,#e8efe6,#f7f0e3);margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#667966}.hero h1{font-size:clamp(28px,5vw,42px);margin:9px 0 6px;letter-spacing:.04em}.hero p{margin:0;color:#657368}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.monthnav{display:flex;gap:10px;align-items:center}.monthnav h2{font-size:22px;min-width:150px;text-align:center;margin:0}.btn,select,input{border:1px solid #dce2d9;background:white;color:var(--ink);border-radius:11px;padding:10px 13px;font:inherit}.btn{cursor:pointer}.btn:hover{background:var(--sage)}.filters{display:flex;gap:8px;flex-wrap:wrap}.calendar{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #273a2c0a}.week,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{text-align:center;padding:13px 4px;color:var(--muted);font-size:13px;background:#fafbf8;border-bottom:1px solid var(--line)}.day{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}.day:nth-child(7n){border-right:0}.day.other{background:#fbfbf9;color:#b7bdb7}.num{font-size:13px;color:#647168;margin-bottom:7px}.today .num{display:inline-flex;background:var(--green);color:white;border-radius:50%;width:25px;height:25px;align-items:center;justify-content:center}.event{display:block;width:100%;border:0;text-align:left;border-radius:7px;padding:5px 6px;margin:4px 0;background:var(--sage);color:#345541;font-size:12px;line-height:1.4;cursor:pointer;overflow-wrap:anywhere}.event:hover{filter:brightness(.97)}.event .time{opacity:.7;font-size:10px;display:block}.empty{padding:34px;text-align:center;color:var(--muted)}.status{font-size:12px;color:var(--muted);margin:12px 2px}.upcoming{margin-top:28px}.upcoming h2{font-size:21px}.eventlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.eventcard{background:white;border:1px solid var(--line);border-radius:14px;padding:15px}.eventcard .date{color:var(--gold);font-size:12px;font-weight:700}.eventcard h3{margin:7px 0;font-size:16px}.eventcard p{margin:5px 0;color:#66736a;font-size:13px;white-space:pre-line}.modal{position:fixed;inset:0;background:#18251dcc;display:none;align-items:center;justify-content:center;padding:18px;z-index:4}.modal.show{display:flex}.panel{background:white;border-radius:18px;padding:22px;max-width:480px;width:100%;max-height:85vh;overflow:auto}.panel h2{margin-top:0}.panel p{white-space:pre-line;line-height:1.6}.close{float:right}.foot{text-align:center;color:#8a938b;font-size:12px;margin-top:25px}@media(max-width:650px){.wrap{padding:14px 9px 35px}.hero{padding:21px 18px}.day{min-height:83px;padding:4px}.week div{font-size:11px;padding:10px 1px}.num{font-size:11px;margin-bottom:3px}.event{font-size:10px;padding:4px 3px;margin:3px 0}.event .time{font-size:9px}.monthnav h2{font-size:19px;min-width:125px}.toolbar{align-items:flex-start}.day .more{font-size:10px;color:var(--muted)}}
</style></head>
<body><main class="wrap"><header class="hero"><div class="eyebrow">美里佛教居士林 · 2027</div><h1>全年活动日历</h1><p>法喜相聚 · 感恩同行 · 一目了然掌握全年活动</p></header>
<div class="toolbar"><div class="monthnav"><button class="btn" id="prev" aria-label="上个月">‹</button><h2 id="monthLabel">载入中…</h2><button class="btn" id="next" aria-label="下个月">›</button><button class="btn" id="today">今天</button></div><div class="filters"><input id="search" placeholder="搜索活动…" aria-label="搜索活动"><select id="category"><option value="">所有活动</option></select></div></div>
<section class="calendar"><div class="week"><div>星期日</div><div>星期一</div><div>星期二</div><div>星期三</div><div>星期四</div><div>星期五</div><div>星期六</div></div><div class="days" id="days"></div></section><div class="status" id="status">正在载入公开日历资料…</div>
<section class="upcoming"><h2>近期活动</h2><div class="eventlist" id="upcoming"></div></section><div class="foot">活动资料以主办单位公布为准 · 日历资料自动读取公开表格</div></main>
<div class="modal" id="modal"><div class="panel"><button class="btn close" id="close">关闭 ✕</button><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const ACTIVITY_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv';
const DATE_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv';
let events=[],dateInfo={},view=new Date();view.setDate(1);const $=id=>document.getElementById(id);
function parseCSV(s){let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'&&q&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[\s_\-（）()：:／/]/g,'')}
function findHeader(rows,needles){for(let i=0;i<Math.min(rows.length,30);i++){let h=rows[i].map(x=>x.trim());if(needles.every(keys=>h.some(c=>keys.some(k=>norm(c).includes(norm(k))))))return {index:i,headers:h}}return {index:-1,headers:[]}}
function col(h,keys){return h.findIndex(x=>keys.some(k=>norm(x)===norm(k)||norm(x).includes(norm(k))))}
function parseDate(raw){if(raw===undefined||raw===null||!String(raw).trim())return null;let s=String(raw).trim();let m=s.match(/^(\d{4})[./年-](\d{1,2})[./月-](\d{1,2})日?$/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);if(m){let a=+m[1],b=+m[2],y=+m[3];return a>12?new Date(y,b-1,a):new Date(y,a-1,b)}let n=Number(s);if(Number.isFinite(n)&&n>20000&&n<70000){let d=new Date(Date.UTC(1899,11,30)+n*86400000);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}let d=new Date(s);return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function val(r,h,keys){let i=col(h,keys);return i>=0?String(r[i]||'').trim():''}
function timeText(r,h){let a=val(r,h,['开始时间']),b=val(r,h,['结束时间']);return a&&b?a+' – '+b:(a||b)}
function parseActivities(csv){let rows=parseCSV(csv),found=findHeader(rows,[['活动名称'],['开始日期']]);if(found.index<0)throw Error('活动总表找不到「活动名称」和「开始日期」栏位');let h=found.headers,out=[];for(let r of rows.slice(found.index+1)){let title=val(r,h,['活动名称']);let start=parseDate(val(r,h,['开始日期']));if(!title||!start)continue;let enabled=val(r,h,['启用']);if(enabled&&/否|no|false|停用|0/i.test(enabled))continue;let end=parseDate(val(r,h,['结束日期']))||start;let freq=val(r,h,['频率']),repeatTo=parseDate(val(r,h,['重复至']))||end;let base={title,category:val(r,h,['活动类别','活动类别']),start,end,time:timeText(r,h),venue:val(r,h,['地点']),owner:val(r,h,['负责人/单位','负责人','单位']),note:val(r,h,['备注']),color:val(r,h,['显示颜色'])};let days=[];let f=norm(freq);if(/每周|weekly|每星期|星期/.test(f)){let stop=repeatTo<start?start:repeatTo;for(let d=new Date(start);d<=stop;d.setDate(d.getDate()+1)){if(d.getDay()===start.getDay())days.push(new Date(d))}}else if(/每日|每天|daily/.test(f)){for(let d=new Date(start);d<=repeatTo;d.setDate(d.getDate()+1))days.push(new Date(d))}else if(/每月|monthly/.test(f)){for(let d=new Date(start);d<=repeatTo;d.setMonth(d.getMonth()+1))days.push(new Date(d))}else {for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d))}for(let d of days)out.push({...base,date:d,endDate:end,occurrence:true,description:[base.owner?'负责人/单位：'+base.owner:'',base.note?'备注：'+base.note:'',freq?'频率：'+freq:''].filter(Boolean).join('\n')})}return out.sort((a,b)=>a.date-b.date)}
function parseDateInfo(csv){let rows=parseCSV(csv),found=findHeader(rows,[['日期']]);if(found.index<0)throw Error('日期资料找不到「日期」栏位');let h=found.headers,info={};for(let r of rows.slice(found.index+1)){let d=parseDate(val(r,h,['日期']));if(!d)continue;let key=keyDate(d);info[key]={holiday:val(r,h,['公共假期（Sarawak）','公共假期','假期']),lunar:val(r,h,['农历标记','农历']),note:val(r,h,['资料来源/备注','备注'])}}return info}
function keyDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function matches(e){let s=$('search').value.trim().toLowerCase(),c=$('category').value;return(!s||(e.title+' '+e.venue+' '+e.category+' '+e.description+' '+e.holiday+' '+e.lunar).toLowerCase().includes(s))&&(!c||e.category===c)}
function fmt(d){return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}function same(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function showEvent(e){$('modalTitle').textContent=e.title;$('modalBody').innerHTML='';[['日期',fmt(e.date)],['时间',e.time],['地点',e.venue],['类别',e.category],['负责人/单位',e.owner],['公共假期',e.holiday],['农历',e.lunar],['详情',e.description]].forEach(([k,v])=>{if(v){let p=document.createElement('p');let b=document.createElement('strong');b.textContent=k+'：';p.append(b,document.createTextNode(v));$('modalBody').append(p)}});$('modal').classList.add('show')}
function eventButton(e){let b=document.createElement('button');b.className='event';b.textContent=e.title;if(e.time){let t=document.createElement('span');t.className='time';t.textContent=e.time;b.append(t)}b.onclick=()=>showEvent(e);return b}
function render(){let y=view.getFullYear(),m=view.getMonth();$('monthLabel').textContent=`${y}年${m+1}月`;let first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),today=new Date(),root=$('days');root.innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let info=dateInfo[keyDate(d)]||{};let cell=document.createElement('div');cell.className='day'+(d.getMonth()!==m?' other':'')+(same(d,today)?' today':'');let n=document.createElement('div');n.className='num';n.textContent=d.getDate();cell.append(n);if(info.lunar){let lunar=document.createElement('div');lunar.style.cssText='font-size:10px;color:#b48b4e;margin:-4px 0 4px;overflow-wrap:anywhere';lunar.textContent=info.lunar;cell.append(lunar)}if(info.holiday){let hol=document.createElement('div');hol.style.cssText='font-size:10px;color:#b24f45;margin:2px 0 4px;overflow-wrap:anywhere';hol.textContent=info.holiday;cell.append(hol)}let es=events.filter(e=>same(e.date,d)&&matches({...e,holiday:info.holiday,lunar:info.lunar}));es.slice(0,3).forEach(e=>cell.append(eventButton({...e,holiday:info.holiday,lunar:info.lunar})));if(es.length>3){let more=document.createElement('div');more.className='more';more.textContent=`另有 ${es.length-3} 项`;cell.append(more)}root.append(cell)}let t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());let list=events.filter(e=>matches({...e,...dateInfo[keyDate(e.date)]})&&e.date>=t0).slice(0,12);$('upcoming').innerHTML='';if(!list.length)$('upcoming').innerHTML='<div class="empty">目前没有符合条件的近期活动</div>';list.forEach(e=>{let card=document.createElement('article');card.className='eventcard';let info=dateInfo[keyDate(e.date)]||{};let date=document.createElement('div');date.className='date';date.textContent=fmt(e.date)+(e.time?' · '+e.time:'');let title=document.createElement('h3');title.textContent=e.title;card.append(date,title);if(info.holiday){let p=document.createElement('p');p.textContent='公共假期：'+info.holiday;card.append(p)}if(info.lunar){let p=document.createElement('p');p.textContent='农历：'+info.lunar;card.append(p)}if(e.venue){let p=document.createElement('p');p.textContent='地点：'+e.venue;card.append(p)}if(e.category){let p=document.createElement('p');p.textContent=e.category;card.append(p)}card.onclick=()=>showEvent({...e,...info});card.style.cursor='pointer';$('upcoming').append(card)});$('status').textContent=`共载入 ${events.length} 个活动日期 · 已同步公共假期与农历资料 · 每 5 分钟自动更新`}
async function fetchCSV(url){let res=await fetch(url+'&_='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let txt=await res.text();if(txt.trim().startsWith('<'))throw Error('Google 未返回 CSV 格式，请确认该工作表已发布');return txt}
async function load(){try{let results=await Promise.all([fetchCSV(ACTIVITY_CSV),fetchCSV(DATE_CSV)]);events=parseActivities(results[0]);dateInfo=parseDateInfo(results[1]);let cats=[...new Set(events.map(e=>e.category).filter(Boolean))].sort();let select=$('category'),chosen=select.value;select.innerHTML='<option value="">所有活动</option>';cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;select.append(o)});select.value=cats.includes(chosen)?chosen:'';render();}catch(e){$('status').textContent='暂时无法读取 Google Sheet：'+e.message;$('days').innerHTML='<div class="empty" style="grid-column:1/-1">无法载入日历资料。请确认两个 CSV 链接均已发布，并可在无须登录的浏览器中打开。</div>'}}
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('today').onclick=()=>{view=new Date();view.setDate(1);render()};$('search').oninput=render;$('category').onchange=render;$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};load();setInterval(load,5*60*1000);
</script></body></html>
