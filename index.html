
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#244f45">
<title>美里佛教居士林｜2027 年活动日历</title>

<style>
:root {
  --green: #376b5b;
  --light-green: #e7f1ec;
  --ink: #273444;
  --muted: #6b7280;
  --line: #e5e7eb;
  --bg: #f4f6f5;
  --gold: #c58d45;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI",
    "Microsoft YaHei", sans-serif;
}

/* ===== Header and Logo ===== */

header {
  background: linear-gradient(135deg, #244f45, #477a68);
  color: white;
  padding: 24px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: left;
  overflow: visible;
}

.logo-frame {
  width: 100px;
  height: 100px;
  flex: 0 0 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.site-logo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  flex-shrink: 0;
  border: none;
  border-radius: 0;
}

.header-text {
  min-width: 0;
}

header h1 {
  margin: 0;
  font-size: clamp(24px, 4vw, 36px);
  letter-spacing: .06em;
  line-height: 1.35;
}

header p {
  margin: 7px 0 0;
  color: #e4eee9;
  line-height: 1.5;
}

header .english-name {
  font-size: 12px;
  letter-spacing: 1.5px;
  color: #e7d6b6;
}

/* ===== Main layout ===== */

main {
  max-width: 1200px;
  margin: 22px auto;
  padding: 0 16px 40px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 16px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

button, input {
  font: inherit;
  border: 1px solid #d1d5db;
  border-radius: 9px;
  padding: 9px 12px;
  background: white;
  color: var(--ink);
}

button { cursor: pointer; }

button.primary {
  background: var(--green);
  color: white;
  border-color: var(--green);
}

button:hover {
  border-color: #8bb4a4;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#monthLabel {
  font-size: 20px;
  font-weight: 700;
  min-width: 135px;
  text-align: center;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
  gap: 16px;
}

.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  min-width: 0;
}

.panel-head {
  padding: 15px 17px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.panel-head h2 {
  font-size: 17px;
  margin: 0;
}

.status {
  font-size: 12px;
  color: var(--muted);
}

/* ===== Calendar ===== */

.calendar { padding: 12px; }

.weekdays, .days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 5px;
}

.weekdays div {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  padding: 8px 0;
}

.day {
  border: 1px solid #edf0ef;
  min-height: 100px;
  border-radius: 9px;
  padding: 6px;
  background: white;
  cursor: pointer;
  overflow: hidden;
  min-width: 0;
}

.day:hover {
  border-color: #8bb4a4;
  background: #fbfdfc;
}

.day.outside {
  background: #f8f9f8;
  color: #a6adb4;
}

.day.today {
  border: 2px solid var(--gold);
}

.day.selected {
  background: var(--light-green);
  border-color: var(--green);
}

.daynum {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 5px;
}

.event-chip {
  display: block;
  background: #e8f1ed;
  color: #285c4c;
  border-left: 3px solid #548b76;
  border-radius: 4px;
  padding: 3px 4px;
  margin: 3px 0;
  font-size: 11px;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.event-chip.more {
  background: #f3f4f6;
  color: #59616b;
  border-left-color: #9ca3af;
}

/* ===== Event list ===== */

.side-content { padding: 14px 16px; }

.event-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.event {
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.event h3 {
  margin: 5px 0;
  font-size: 15px;
}

.event p {
  margin: 4px 0;
  color: #586270;
  font-size: 13px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.event .date {
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
}

.empty {
  padding: 25px 10px;
  text-align: center;
  color: var(--muted);
}

.error {
  margin: 12px 0;
  padding: 12px 14px;
  background: #fff1f0;
  color: #9f2d25;
  border: 1px solid #ffd2ce;
  border-radius: 10px;
  display: none;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.footnote {
  color: var(--muted);
  font-size: 12px;
  margin-top: 14px;
  line-height: 1.5;
}

.pill {
  display: inline-block;
  font-size: 10px;
  border-radius: 20px;
  padding: 2px 6px;
  background: #f4eadb;
  color: #86591c;
  margin-left: 3px;
}

footer {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 16px 28px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

@media(max-width: 850px) {
  .layout { grid-template-columns: 1fr; }
  .day { min-height: 80px; padding: 4px; }
  .event-chip { font-size: 10px; }
  .toolbar { align-items: flex-start; }
  #monthLabel { min-width: 110px; }
}

@media(max-width: 520px) {
  header {
    gap: 12px;
    padding: 18px 12px;
  }

  .logo-frame {
    width: 70px;
    height: 70px;
    flex-basis: 70px;
  }

  header h1 {
    font-size: 21px;
    letter-spacing: 0;
  }

  header p {
    font-size: 12px;
  }

  header .english-name {
    font-size: 9px;
    letter-spacing: .7px;
  }

  main {
    padding: 0 8px 25px;
    margin-top: 12px;
  }

  .calendar { padding: 5px; }

  .weekdays, .days { gap: 2px; }

  .day {
    min-height: 65px;
    border-radius: 5px;
  }

  .daynum { font-size: 12px; }

  .event-chip {
    font-size: 9px;
    padding: 2px;
  }

  .toolbar { padding: 10px; }
  .controls { gap: 5px; }

  button, input {
    padding: 8px;
    font-size: 13px;
  }
}

@media(max-width: 360px) {
  header { gap: 9px; }

  .logo-frame {
    width: 58px;
    height: 58px;
    flex-basis: 58px;
  }

  header h1 { font-size: 18px; }
  header .english-name { font-size: 8px; }
}
</style>
</head>

<body>

<header>
  <div class="logo-frame">
    <img
      src="./logo.png"
      alt="美里佛教居士林 Logo"
      class="site-logo"
      id="siteLogo"
    >
  </div>

  <div class="header-text">
    <h1>美里佛教居士林</h1>
    <p class="english-name">MIRI BUDDHIST SOCIETY · EST. 1993</p>
    <p>2027 年活动日历 · 活动安排 · 日期查询 · 即时更新</p>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="controls">
      <button id="prevBtn">‹ 上个月</button>
      <button id="todayBtn">今天</button>
      <button id="nextBtn">下个月 ›</button>
      <span id="monthLabel">2027 年 1 月</span>
    </div>

    <div class="controls">
      <input
        id="searchInput"
        type="search"
        placeholder="搜索活动、地点、负责人…"
        aria-label="搜索活动"
      >
      <button id="refreshBtn" class="primary">刷新数据</button>
    </div>
  </div>

  <div id="errorBox" class="error" role="alert"></div>

  <div class="layout">
    <section class="panel">
      <div class="panel-head">
        <h2>月历</h2>
        <span id="loadStatus" class="status">正在载入活动…</span>
      </div>

      <div class="calendar">
        <div class="weekdays">
          <div>日</div><div>一</div><div>二</div><div>三</div>
          <div>四</div><div>五</div><div>六</div>
        </div>

        <div id="days" class="days"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="listTitle">本月活动</h2>
        <span id="resultCount" class="status"></span>
      </div>

      <div class="side-content">
        <div id="eventList" class="event-list">
          <div class="empty">正在载入…</div>
        </div>

        <div class="footnote">
          活动资料来自 Google Sheets。点击「刷新数据」读取最新资料。
          网站每 5 分钟自动检查更新。
        </div>
      </div>
    </section>
  </div>
</main>

<footer>
  美里佛教居士林 · 愿正法久住，愿众生离苦得乐。
</footer>

<script>
"use strict";

/* Google Sheets CSV links */
const ACTIVITY_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=1830432104&single=true&output=csv";

const DATE_INFO_CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTcmNKJ322HzGxtlRqsQNQ-1DLRq-LXcivKuWEt7DWfXnf_EpofCpUkzbL9FUvK_WSxH0RaHbsCs5mY/pub?gid=688612611&single=true&output=csv";

let activities = [];
let dateInfo = [];
let viewDate = new Date(2027, 0, 1);
let selectedDate = "";
let searchTerm = "";

const $ = id => document.getElementById(id);

const clean = value =>
  String(value ?? "").replace(/^\uFEFF/, "").trim();

const norm = value =>
  clean(value).toLowerCase().replace(/[\s_\-()（）:：/]+/g, "");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

/* CSV parser: supports quoted commas, line breaks and escaped quotes */
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let quoted = false;

  text = String(text ?? "").replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (quoted) {
      if (c === '"' && text[i + 1] === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        quoted = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"' && field === "") {
        quoted = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;

        row.push(field);

        if (row.some(v => clean(v) !== "")) rows.push(row);

        row = [];
        field = "";
      } else {
        field += c;
      }
    }
  }

  row.push(field);

  if (row.some(v => clean(v) !== "")) rows.push(row);

  return rows;
}

function validDate(year, month, day) {
  const date = new Date(year, month - 1, day);

  return date.getFullYear() === year &&
    date.getMonth() === month - 1 &&
    date.getDate() === day
      ? date
      : null;
}

/* Common date formats used by Google Sheets */
function parseDate(value) {
  const s = clean(value);
  if (!s) return null;

  let m;

  // yyyy-mm-dd, yyyy/mm/dd or yyyy.mm.dd
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:$|T|\s)/);
  if (m) return validDate(+m[1], +m[2], +m[3]);

  // dd/mm/yyyy or dd-mm-yyyy (Malaysian format)
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return validDate(+m[3], +m[2], +m[1]);

  const months = {
    jan:0, january:0, feb:1, february:1,
    mar:2, march:2, apr:3, april:3,
    may:4, jun:5, june:5, jul:6, july:6,
    aug:7, august:7, sep:8, sept:8, september:8,
    oct:9, october:9, nov:10, november:10,
    dec:11, december:11
  };

  // 13-Feb-27 or 13 Feb 2027
  m = s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s,\-\/]+(\d{2,4})$/);

  if (m && months[m[2].toLowerCase()] !== undefined) {
    let year = +m[3];
    if (year < 100) year += year < 50 ? 2000 : 1900;

    return validDate(year, months[m[2].toLowerCase()] + 1, +m[1]);
  }

  // Feb 13, 2027
  m = s.match(/^([A-Za-z]{3,9})\s+(\d{1,2}),?\s+(\d{4})$/);

  if (m && months[m[1].toLowerCase()] !== undefined) {
    return validDate(+m[3], months[m[1].toLowerCase()] + 1, +m[2]);
  }

  // Google Sheets serial date
  if (/^\d{5}(?:\.0+)?$/.test(s)) {
    const d = new Date(
      Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 86400000
    );

    return validDate(
      d.getUTCFullYear(),
      d.getUTCMonth() + 1,
      d.getUTCDate()
    );
  }

  const parsed = new Date(s);

  if (!isNaN(parsed)) {
    return validDate(
      parsed.getFullYear(),
      parsed.getMonth() + 1,
      parsed.getDate()
    );
  }

  return null;
}

function dateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function fromKey(key) {
  const m = String(key).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

function addDays(date, number) {
  const result = new Date(date);
  result.setDate(result.getDate() + number);
  return result;
}

/* Locate a likely header row, including sheets with a title above the table */
function rowsToObjects(rows) {
  if (!rows.length) return [];

  let headerRow = 0;
  let bestScore = -1;

  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    const cells = rows[i].map(norm);

    const score = cells.filter(cell =>
      /activity|event|活动|title|名称|startdate|开始日期|date|日期/.test(cell)
    ).length;

    if (score > bestScore) {
      bestScore = score;
      headerRow = i;
    }
  }

  const headers = rows[headerRow].map(clean);

  return rows.slice(headerRow + 1)
    .filter(row => row.some(value => clean(value) !== ""))
    .map(row => {
      const obj = {};

      headers.forEach((header, index) => {
        if (header) obj[header] = clean(row[index]);
      });

      return obj;
    });
}

function getValue(obj, patterns) {
  const entry = Object.entries(obj).find(([key, value]) =>
    patterns.some(pattern => pattern.test(norm(key))) &&
    clean(value) !== ""
  );

  return entry ? clean(entry[1]) : "";
}

function detectActivities(rows) {
  const objects = rowsToObjects(rows);

  return objects.map((obj, i) => {
    const title = getValue(obj, [
      /^(activity|event|活动名称|活动|title|name|eventname|activityname)$/,
      /activityname/, /eventname/, /活动名称/
    ]);

    const startRaw = getValue(obj, [
      /^(startdate|start|date|日期|开始日期|活动日期|eventdate)$/,
      /startdate/, /开始日期/, /活动日期/, /^date$/
    ]);

    const endRaw = getValue(obj, [
      /^(enddate|end|结束日期)$/,
      /enddate/, /结束日期/
    ]);

    const enabled = getValue(obj, [
      /^(enabled|active|status|启用|状态|是否启用)$/,
      /enabled/, /active/
    ]);

    const category = getValue(obj, [
      /^(category|type|类别|类型|分类)$/,
      /category/, /类别/, /类型/
    ]);

    const location = getValue(obj, [
      /^(location|venue|地点|场地)$/,
      /location/, /venue/, /地点/, /场地/
    ]);

    const owner = getValue(obj, [
      /^(owner|personincharge|负责人|负责人员|联系人)$/,
      /owner/, /负责人/, /联系人/
    ]);

    const description = getValue(obj, [
      /^(description|details|备注|说明|内容)$/,
      /description/, /details/, /备注/, /说明/
    ]);

    const recurrence = getValue(obj, [
      /^(recurrence|repeat|重复|重复规则)$/,
      /recurrence/, /repeat/, /重复/
    ]);

    const start = parseDate(startRaw);
    const end = parseDate(endRaw) || start;

    if (!title || !start) return null;

    if (/^(false|no|n|0|inactive|disabled|否|停用)$/i.test(enabled)) {
      return null;
    }

    return {
      id: "a" + i,
      title,
      start,
      end,
      category,
      location,
      owner,
      description,
      recurrence
    };
  }).filter(Boolean);
}

/* Expand multi-day and recurring activities */
function expandActivities(items) {
  const expanded = [];

  for (const activity of items) {
    const start = activity.start;
    const end = activity.end || start;
    const rule = (activity.recurrence || "").toLowerCase();

    if (!rule || /^(none|no|never|无|不重复|一次|one.?time)$/i.test(rule)) {
      for (
        let date = new Date(start), count = 0;
        date <= end && count < 370;
        date = addDays(date, 1), count++
      ) {
        expanded.push({ ...activity, date: dateKey(date) });
      }

      continue;
    }

    const mode =
      /daily|每天|每日|日重复/.test(rule) ? "daily" :
      /weekly|每周|星期|周重复/.test(rule) ? "weekly" :
      /monthly|每月|月重复/.test(rule) ? "monthly" : "";

    if (!mode) {
      expanded.push({ ...activity, date: dateKey(start) });
      continue;
    }

    const lastDate = end > start ? end : new Date(2027, 11, 31);

    const stop = new Date(Math.min(
      lastDate.getTime(),
      new Date(2028, 11, 31).getTime()
    ));

    for (
      let date = new Date(start), count = 0;
      date <= stop && count < 500;
      date = addDays(date, 1), count++
    ) {
      const match =
        mode === "daily" ||
        (mode === "weekly" && date.getDay() === start.getDay()) ||
        (mode === "monthly" && date.getDate() === start.getDate());

      if (match) expanded.push({ ...activity, date: dateKey(date) });
    }
  }

  return expanded;
}

function parseDateInfo(rows) {
  return rowsToObjects(rows).map(obj => {
    const raw = getValue(obj, [
      /^(date|日期|公历日期|gregoriandate)$/,
      /date/, /日期/
    ]);

    const date = parseDate(raw);
    if (!date) return null;

    return {
      date: dateKey(date),
      lunar: getValue(obj, [
        /^(lunar|lunarcalendar|农历|农历日期)$/,
        /lunar/, /农历/
      ]),
      holiday: getValue(obj, [
        /^(holiday|publicholiday|节日|公共假期|假期)$/,
        /holiday/, /节日/, /假期/
      ]),
      note: getValue(obj, [
        /^(note|备注|说明)$/,
        /note/, /备注/
      ])
    };
  }).filter(Boolean);
}

async function fetchCSV(url) {
  const response = await fetch(url, { cache: "no-store" });

  if (!response.ok) {
    throw new Error(`HTTP ${response.status} ${response.statusText}`);
  }

  const text = await response.text();
  const trimmed = text.trim();

  if (!trimmed) throw new Error("CSV 内容为空。");

  if (/^<!doctype html/i.test(trimmed) || /^<html/i.test(trimmed)) {
    throw new Error("Google Sheets 返回 HTML，而不是 CSV。请检查发布设置。");
  }

  return parseCSV(text);
}

async function loadData() {
  $("refreshBtn").disabled = true;
  $("loadStatus").textContent = "正在载入…";
  $("errorBox").style.display = "none";

  try {
    const activityRows = await fetchCSV(ACTIVITY_CSV_URL);
    const parsed = detectActivities(activityRows);

    if (!parsed.length) {
      console.error("活动 CSV 前 20 行：", activityRows.slice(0, 20));

      throw new Error(
        "已连接 CSV，但无法识别活动日期或活动名称。请检查 Google Sheets 的实际表头。"
      );
    }

    activities = expandActivities(parsed);

    // Date information is optional. Failure here will not hide activities.
    try {
      dateInfo = parseDateInfo(await fetchCSV(DATE_INFO_CSV_URL));
    } catch (dateError) {
      console.warn("日期附加资料无法载入：", dateError);
      dateInfo = [];
    }

    $("loadStatus").textContent = `成功载入 ${parsed.length} 项活动`;
    render();

  } catch (error) {
    console.error("Calendar loading error:", error);

    $("loadStatus").textContent = "载入失败";
    $("errorBox").textContent =
      "活动资料载入失败：\n" + error.message +
      "\n\n如果出现 Failed to fetch，可能是网络或跨站请求问题。" +
      "如果提示无法识别活动，则需要根据实际 CSV 表头调整识别规则。";

    $("errorBox").style.display = "block";

    $("eventList").innerHTML =
      '<div class="empty">暂时无法显示活动。请检查资料连接后再刷新。</div>';

  } finally {
    $("refreshBtn").disabled = false;
  }
}

function infoFor(key) {
  return dateInfo.find(item => item.date === key);
}

function matchesSearch(activity) {
  return !searchTerm ||
    [
      activity.title,
      activity.category,
      activity.location,
      activity.owner,
      activity.description
    ].join(" ").toLowerCase().includes(searchTerm);
}

function activityOn(key) {
  return activities.filter(activity =>
    activity.date === key && matchesSearch(activity)
  );
}

function renderCalendar() {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();

  $("monthLabel").textContent = `${year} 年 ${month + 1} 月`;

  const first = new Date(year, month, 1);
  const start = addDays(first, -first.getDay());
  const todayKey = dateKey(new Date());

  let html = "";

  for (let i = 0; i < 42; i++) {
    const date = addDays(start, i);
    const key = dateKey(date);
    const inMonth = date.getMonth() === month;
    const events = activityOn(key);
    const info = infoFor(key);

    const classes = "day" +
      (!inMonth ? " outside" : "") +
      (key === todayKey ? " today" : "") +
      (key === selectedDate ? " selected" : "");

    html += `
      <div class="${classes}" data-date="${key}"
        tabindex="0" role="button" aria-label="${key}">
        <div class="daynum">
          ${date.getDate()}
          ${info && info.holiday
            ? '<span class="pill">假期</span>'
            : ""}
        </div>

        ${info && info.lunar
          ? `<div style="font-size:10px;color:#8a929b;margin-bottom:3px">${escapeHTML(info.lunar)}</div>`
          : ""}

        ${events.slice(0, 3).map(event =>
          `<span class="event-chip" title="${escapeHTML(event.title)}">${escapeHTML(event.title)}</span>`
        ).join("")}

        ${events.length > 3
          ? `<span class="event-chip more">另有 ${events.length - 3} 项</span>`
          : ""}

        ${info && info.holiday
          ? `<div style="font-size:10px;color:#9a6a2d">${escapeHTML(info.holiday)}</div>`
          : ""}
      </div>`;
  }

  $("days").innerHTML = html;

  $("days").querySelectorAll(".day").forEach(element => {
    const choose = () => {
      selectedDate = element.dataset.date;
      render();
    };

    element.addEventListener("click", choose);

    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        choose();
      }
    });
  });
}

function eventCard(activity) {
  const date = fromKey(activity.date);

  const dateText = date
    ? date.toLocaleDateString("zh-MY", {
        year: "numeric",
        month: "short",
        day: "numeric",
        weekday: "short"
      })
    : activity.date;

  return `
    <article class="event">
      <div class="date">${escapeHTML(dateText)}</div>
      <h3>${escapeHTML(activity.title)}</h3>

      ${activity.category
        ? `<p>类别：${escapeHTML(activity.category)}</p>`
        : ""}

      ${activity.location
        ? `<p>地点：${escapeHTML(activity.location)}</p>`
        : ""}

      ${activity.owner
        ? `<p>负责人：${escapeHTML(activity.owner)}</p>`
        : ""}

      ${activity.description
        ? `<p>${escapeHTML(activity.description)}</p>`
        : ""}
    </article>`;
}

function renderList() {
  const all = activities.filter(matchesSearch);
  let list;
  let title;

  if (selectedDate) {
    list = all.filter(activity => activity.date === selectedDate);
    title = `${selectedDate} 的活动`;
  } else {
    list = all.filter(activity => {
      const date = fromKey(activity.date);

      return date &&
        date.getFullYear() === viewDate.getFullYear() &&
        date.getMonth() === viewDate.getMonth();
    });

    title = searchTerm
      ? "搜索结果"
      : `${viewDate.getFullYear()} 年 ${viewDate.getMonth() + 1} 月活动`;
  }

  list.sort((a, b) =>
    a.date.localeCompare(b.date) ||
    a.title.localeCompare(b.title)
  );

  $("listTitle").textContent = title;
  $("resultCount").textContent = `${list.length} 项`;

  if (!list.length) {
    $("eventList").innerHTML =
      `<div class="empty">${
        searchTerm
          ? "没有找到符合条件的活动。"
          : "这一天 / 这个月份暂时没有活动。"
      }</div>`;

    return;
  }

  $("eventList").innerHTML =
    list.slice(0, 150).map(eventCard).join("") +
    (list.length > 150
      ? '<div class="empty">仅显示前 150 项，请缩小搜索范围。</div>'
      : "");
}

function render() {
  renderCalendar();
  renderList();
}

/* ===== Buttons and search ===== */

$("prevBtn").addEventListener("click", () => {
  viewDate = new Date(
    viewDate.getFullYear(),
    viewDate.getMonth() - 1,
    1
  );

  selectedDate = "";
  render();
});

$("nextBtn").addEventListener("click", () => {
  viewDate = new Date(
    viewDate.getFullYear(),
    viewDate.getMonth() + 1,
    1
  );

  selectedDate = "";
  render();
});

$("todayBtn").addEventListener("click", () => {
  const now = new Date();

  viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
  selectedDate = dateKey(now);

  render();
});

$("refreshBtn").addEventListener("click", loadData);

$("searchInput").addEventListener("input", event => {
  searchTerm = event.target.value.trim().toLowerCase();
  render();
});

/* ===== Initial load and automatic refresh ===== */

render();
loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>

</body>
</html>
